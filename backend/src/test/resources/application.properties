# Tests use H2 in-memory database in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:campushub_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-demand.sql,classpath:schema-response.sql,classpath:schema-order.sql,classpath:schema-review.sql,classpath:schema-notification.sql,classpath:schema-recommendation.sql,classpath:schema-asset.sql
app.demo-data.enabled=false

mybatis-plus.configuration.map-underscore-to-camel-case=true

app.security.jwt.secret=ZGV2LWNhbXB1c2h1Yi1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0yNTYtYml0cw==

# ========== Spring AI 测试环境配置 ==========
# 测试不调用真实 provider，仅用占位符让 Spring AI 自动配置能完成 bean 初始化；
# AiConfig 检测到占位符后返回 null ChatClient，调用 AI 接口时由 service 返回业务错误。
spring.ai.openai.base-url=https://tokenhub.tencentmaas.com
spring.ai.openai.api-key=not-configured
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=deepseek/deepseek-flash
