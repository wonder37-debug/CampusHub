spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campushub?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
# 使用占位符，默认密码是 root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:init_schema.sql

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 文件上传配置
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB
app.upload.dir=uploads

# 默认激活 local 环境
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 邮箱验证码配置
app.auth.allowed-email-domains=${APP_AUTH_ALLOWED_EMAIL_DOMAINS:edu.cn,example.edu.cn,campus.edu,test.edu.cn,nju.edu.cn,smail.nju.edu.cn}
app.mail.from=${APP_MAIL_FROM:}

# SMTP 配置模板
# 常见提供商：
# QQ 邮箱：smtp.qq.com / 465
# 163 邮箱：smtp.163.com / 465
# Gmail：smtp.gmail.com / 587
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=${SPRING_MAIL_DEFAULT_ENCODING:UTF-8}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# JWT 认证配置（默认密钥仅用于本地开发，生产须通过 APP_JWT_SECRET 覆盖）
app.security.jwt.secret=${APP_JWT_SECRET:ZGV2LWNhbXB1c2h1Yi1qd3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0yNTYtYml0cw==}
app.security.jwt.expiry-seconds=${APP_JWT_EXPIRY_SECONDS:3600}

# ========== Spring AI 配置（OpenAI-compatible Chat Completions）==========
# TokenHub / DeepSeek OpenAI-compatible endpoint
# 重要：AI_API_KEY 必须通过环境变量注入，这里不提供任何默认真实值；缺省为空字符串
spring.ai.openai.base-url=${AI_BASE_URL:https://tokenhub.tencentmaas.com}
# 重要：AI_API_KEY 必须通过环境变量注入，这里仅提供占位符让 Spring AI 自动配置能完成 bean 初始化；
# 占位符不是真实可用的 Key，AiConfig 会检测占位符并跳过 ChatClient 创建，调用 AI 接口时返回业务错误。
spring.ai.openai.api-key=${AI_API_KEY:not-configured}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=${AI_MODEL:deepseek/deepseek-flash}
spring.ai.openai.chat.options.temperature=0.2
# HTTP 超时通过 AiConfig 的 RestClientCustomizer 设置（10s connect / 60s read），
# 因为 spring.ai.openai.connect-timeout-ms / read-timeout-ms 在 Spring AI 1.0 不生效（OpenAiConnectionProperties 无对应字段）。
# Spring AI retry 限制为 2 次（总尝试），且不对 4xx 客户端错误重试，避免 401/403/429 长时间重试。
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.on-client-errors=false
# AI 草稿生成单次请求限制
app.ai.demand-draft.prompt-max-length=${AI_DEMAND_DRAFT_PROMPT_MAX_LENGTH:1000}
