# ============================================================
# 生产环境配置覆盖
# ============================================================
# 激活方式：SPRING_PROFILES_ACTIVE=prod
# 敏感配置不提供默认值，必须通过环境变量注入，避免静默使用弱默认值。

# 数据库密码：生产环境必须通过 DB_PASSWORD 注入，未配置则启动失败
spring.datasource.password=${DB_PASSWORD}

# JWT 密钥：生产环境必须通过 APP_JWT_SECRET 注入（Base64 编码，解码后 >=32 字节）
app.security.jwt.secret=${APP_JWT_SECRET}

# 生产环境不自动执行建表脚本（init_schema.sql 含演示弱密码账号，生产应通过迁移工具管理）
spring.sql.init.mode=never

# 生产环境不创建演示数据
app.demo-data.enabled=false
