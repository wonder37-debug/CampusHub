# ============================================================
# 生产环境配置覆盖
# ============================================================
# 激活方式：SPRING_PROFILES_ACTIVE=prod
# 敏感配置不提供默认值，必须通过环境变量注入，避免静默使用弱默认值。

# 数据库连接：生产环境必须通过环境变量注入，不继承本地 localhost/root 默认值
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT 密钥：生产环境必须通过 APP_JWT_SECRET 注入（Base64 编码，解码后 >=32 字节）
app.security.jwt.secret=${APP_JWT_SECRET}

# 生产环境不自动执行建表脚本（init_schema.sql 含演示弱密码账号，生产应通过迁移工具管理）
spring.sql.init.mode=never
# 新增表/列的生产升级方案：手动执行 backend/src/main/resources/migration-prod.sql（幂等，可重复执行）
# 包含 proof_image_urls 列（ord_order 表）和 uploaded_asset 表（上传资源所有权记录）

# 生产环境不创建演示数据
app.demo-data.enabled=false
